version: 2

sources:
  - name: raw
    database: sales_finance
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null
          - name: crm_id
            data_tests:
              - not_null
      - name: crm_opportunities
        columns:
          - name: opportunity_id
            data_tests:
              - unique
              - not_null
          - name: stage
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["Lead", "Qualified", "Proposal", "Won", "Lost"]
      - name: contracts
        columns:
          - name: contract_id
            data_tests:
              - unique
              - not_null
          - name: price_per_parcel
            data_tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false
      - name: shipments
        columns:
          - name: shipment_id
            data_tests:
              - unique
              - not_null
          - name: customer_id
            data_tests:
              - relationships:
                  arguments:
                    to: source('raw', 'customers')
                    field: customer_id
      - name: shipment_costs
        columns:
          - name: cost_eur
            data_tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
      - name: invoices
        columns:
          - name: invoice_id
            data_tests:
              - unique
              - not_null
          - name: currency
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["EUR"]